version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    ignore:
      # The MSRV job pins the minimum supported Rust version. Dependabot would
      # bump it to the latest release, which defeats the job's purpose.
      - dependency-name: "dtolnay/rust-toolchain"
