name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Do not paste a real report.** This tool handles real output from real systems - redact
        or fabricate anything you include.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include the exact command and its output, redacted.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `agent-inbox --version`
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: macOS 15.2, Ubuntu 24.04
    validations:
      required: true
